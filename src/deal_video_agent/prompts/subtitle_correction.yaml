# 字幕纠正提示词模板

## 知识库构建

knowledge_building: |
  你是游戏资深主播，负责帮我纠正游戏解说视频字幕的问题。
  游戏：{game_name}
  内容主题：{content_topic}

  请搜索网络信息，收集该游戏的专有名词和术语，构建知识库。

  按以下维度整理：

  一、实体名称
  收集游戏中的生物/怪物、物品/装备、方块/材料、技能/能力等名称。

  二、地点与场景
  收集游戏中的地点、维度、建筑、结构、区域等名称。

  三、玩法机制与术语
  收集该游戏特有的玩法系统和对应的术语。

  四、玩家惯用语
  收集玩家常用的简称、谐音、社区黑话等非正式用语。

  五、ASR 易错词（重要）
  针对每个实体，标注可能被语音识别误识别的同音/近音形式，这是字幕纠正的关键依据。

  要求：
  1. 按分类以表格形式输出，每行一条实体
  2. 不确定的条目标注【需确认】，不要编造
  3. 实体名称以中文为主，英文原名作为别名列出

## 字幕修正

subtitle_correction: |
  根据构建的知识库，和字幕上下文，挑出语音模型的识别错误。
  规则：
  1. 中文识别成无意义的英文,但明显是英文/拼音语气词不用纠正,例如 wow,yes,oh等
  2. 同音汉字错误，弹板识别成弹版
  3. 与游戏内容和语义不符合的汉字
  4. 包含屎尿屁的词汇、我去、妈的,鬼等常见口语脏话,对应文字替换成文明用词
  5. 剔除游戏无关的商业品牌、商标名词
  
  当发现某一行有符合上述条件的错误字幕，先计算它在所给字母中位列第几行，然后提供纠正后的话语。只要输出 数字:纠正后内容。数字是纠正内容的行号。其余内容都不用输出。原本正确的语句不用输出。
  
  字幕内容：
  {subtitle_content}

## 标题生成

title_generation: |
  这个字幕文件是一个20集视频的字幕合集。
  每一集视频被平均分割，从前往后给出20个视频标题。
  以下是带行号的字幕原文，请根据实际字幕内容为每一集生成标题：

  {subtitle_content}

  要求：
  1. 不用精确概括视频内容，只要抓住关键词和关键事件，和视频内容有一定弱关联即可。
  2. 标题4~8个字范围内，不强制要求4个字，不强制要求一个合集中的所有标题字数一致。
  3. 标题一定不能重复，并且不能和下面已有标题列表里的标题完全重复。
  4. 标题应多样化，不要在每个标题中都重复合集主题词。
  5. 生成的标题不能包含违禁词：驱魔、附魔、屎、尿、屁、我去、妈的、鬼等。

  输出格式：只输出20个标题，每行一个，不要添加任何序号。不要有其他任何内容。

  已有标题列表：
  {existing_titles}