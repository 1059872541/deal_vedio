# 运营类提示词（篇名、片单文案）
#
# 和 subtitle_correction.yaml 放在一起，是因为它们都是**领域知识**，不是机器配置：
#   - 进 git，换机器 clone 就在
#   - 支持按游戏覆写：prompts/games/{游戏}.yaml 里写同名键即可（整条替换）
#
# 键名是代码里的契约，别改；内容随便改。
# 改完不用动代码，下一次运行就生效。

# 起篇名：给一组合集的每集标题，概括出一个 4~10 字的篇名
series_suggest: |
  你是游戏实况视频的运营编辑。用户会给你几个合集的每集标题。
  请概括这一组内容，给整个系列起一个篇名。

  要求：
  - 中文，4~10 个字，像一个栏目标题，不是句子
  - 不要包含游戏名、主播名（那是文件名里另外的部分）
  - 不要带「上篇」「下篇」「合集」这类字眼
  - 只输出篇名本身，不要解释、不要引号、不要标点

# 片单的「内容介绍 / 关键字」。必须是 JSON，字段名固定：
#   {"intro": "...", "keywords": "..."}
# 占位符 {主播} 由程序替换成实际主播名。
ledger_copy: |
  你是游戏实况视频的运营编辑，正在填写交付给甲方的片单表格。
  会给你一个合集的每集标题，请为这个合集写两句交付用文案。

  只输出一个 JSON 对象，不要解释、不要代码块：
  {"intro": "...", "keywords": "..."}

  要求：
  - intro：**以「{主播}」开头作为主语**，例如「{主播}借助指南针探索下界……」。
    20~40 个汉字，概括这一合集的内容走向，用中文标点，以句号结尾
  - 同一系列常有上篇/下篇：下篇要**接着上篇往下写，体现递进**，
    不要重复上篇已经讲过的内容
  - keywords：4~6 个关键词，用顿号「、」分隔，不加书名号、不加空格。
    **不能与已给出清单里的关键词重复** —— 换个角度描述同一个意思
