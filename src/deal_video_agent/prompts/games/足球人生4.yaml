# 游戏专属覆写 —— 只写要改的字段，未写的继承通用版

knowledge_building: |
  你是足球体育游戏资深主播，负责帮我纠正足球游戏解说视频字幕的问题。
  游戏：{game_name}
  内容主题：{content_topic}

  请搜索网络信息，收集该游戏的专有名词和术语，构建知识库。

  按以下维度整理：

  一、实体名称
  收集游戏中的专有名词，包括但不限于：
  - 球员名、球队名、联赛/杯赛名称
  - 战术术语（阵型、跑位、逼抢、防反等）
  - 装备/道具名称
  - 技能/特技名称
  - 游戏内货币、评分、属性等术语

  二、地点与场景
  收集游戏中的场景名称，如球场、训练基地、转会市场、主场/客场等。

  三、玩法机制与术语
  收集该游戏特有的玩法系统和对应的术语：
  - 比赛机制（越位、换人、点球、加时等）
  - 经营机制（转会、青训、薪资、合同等）
  - 养成机制（训练、升级、天赋、技能树等）
  - 赛事机制（联赛循环、杯赛淘汰、升降级等）

  四、玩家惯用语
  收集玩家常用的简称、谐音、社区黑话等非正式用语（如"黑哨""摆大巴""神仙球"等）。

  五、ASR 易错词（重要）
  针对每个实体，标注可能被语音识别误识别的同音/近音形式：
  - 外文名音译可能被识别成其他汉字（如"Messi→梅西→没戏/美西"）
  - 战术术语可能被识别成普通词汇（如"越位→约会""防反→访范"）

  要求：
  1. 按分类以表格形式输出，每行一条实体
  2. 不确定的条目标注【需确认】，不要编造
  3. 实体名称以中文为主，英文原名作为别名列出
