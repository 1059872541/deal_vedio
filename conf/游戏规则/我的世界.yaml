# ══════════════════════════════════════════════════════════════════
# 我的世界 —— 游戏特殊规则（只写 diff）
#
# 生效规则 = conf/默认规则.yaml  深合并  conf/游戏规则/我的世界.yaml
#            （本文件的值覆盖默认；未写的键沿用默认）
#
# ⚠️ 合并只发生在「创建批次」那一刻。
#    批次建好后，game.yaml 是完整快照，运行时不再读这两个文件。
#
# 合并语义：逐键递归；标量后者覆盖前者；列表整体替换（不追加）。
# ══════════════════════════════════════════════════════════════════

# 唯一的差异：我的世界时长比端游默认长
duration:
  material_per_collection: 9000    # 2.5 小时（默认 7200 = 2 小时）
  episode_body: 450                # 7:30     （默认 360 = 6 分钟）
