# ══════════════════════════════════════════════════════════════════
# agent.yaml —— 字幕 agent 的模型与密钥
#
# 【怎么用】
#   复制 `agent.example.yaml` 为 `agent.yaml`，把值改成你自己的。
#
# 【为什么不放在 本机.yaml】
#   本机.yaml 放的是"这台机器有什么"（路径、ffmpeg 在哪）。
#   这里放的是"用哪个账号、哪个模型"—— 会随厂商更新而变，
#   而且换账号时只改这一处。分开就不用每次动路径配置。
#
# 【不进 git】
#   本文件含明文 key，已在 .gitignore 里。`agent.example.yaml` 入库做模板。
#
# 【为什么模型名不写死在代码里】
#   模型名会变（deepseek-chat → deepseek-v4-pro → deepseek-flash → …）。
#   写死在代码里意味着每次厂商改名都要改代码、提交、重新拉仓库。
#   放这里改一行就行，代码不用动。
# ══════════════════════════════════════════════════════════════════

deepseek:
  # API key。
  # 优先级：环境变量 deepseek_env_key / DEEPSEEK_API_KEY / DEEPSEEK_KEY
  #         > 这里的值
  # 所以 CI 之类不方便写文件的场景，仍然可以用环境变量覆盖。
  api_key: ""

  # 三个用途共用这一个模型：
  #   构建知识库 / 字幕纠错 / 标题生成
  #
  # ⚠ 纠错这一环**不要换成推理模型**。实测推理模型会把 token 全烧在推理里、
  #   正文一个字都不吐（finish_reason=length、content 为空），
  #   结果就是"跑完了但什么都没改"。
  model: "deepseek-flash"

  # 单次回复的 token 上限。
  #
  # **这是上限，不是预留** —— 模型说完就停，按实际用量计费，给大不浪费钱。
  # 必须给推理留够：模型先输出 reasoning_content（内部推理），再输出 content（正文）。
  # 推理把额度吃光时正文为空、finish_reason=length，
  # 表现是"跑了几分钟，字幕一处没改"。
  #
  # 实测（deepseek-flash，走生产同一条链路 run_subtitle_agent）：
  #
  #   素材              行号文件            prompt   completion   结果
  #   21 分钟          8,711 B /   329 行    5,378    12,381      106 秒，stop
  #   2 小时（真实）  38,574 B / 1,552 行   14,035    34,482      231 秒，stop
  #
  # completion ≈ 2.5 × prompt，两档都成立（2.30 / 2.46）——
  # 说明按 prompt 体量估算完成量是可靠的，代码里的开跑前预检就用的这个比例。
  #
  # 8192 在 21 分钟素材上就会截断。98,304 是 2 小时实测需求的 2.85 倍，
  # 按同比例可覆盖到约 5 小时素材，并给推理波动留余量。
  # 想更早失败、少等一会儿，可以调成 65536（≈1.9 倍）；两个值都不会多花钱。
  max_tokens: 98304

# ── 提示词（改这里，不用改代码）──
# 代码里各留了一份兜底默认值：这里删掉某条也不会崩，只是回退到默认。
prompts:
  # 起篇名：给一组合集的每集标题，让它概括出一个 4~10 字的篇名
  series_suggest: |
    你是游戏实况视频的运营编辑。用户会给你几个合集的每集标题。
    请概括这一组内容，给整个系列起一个篇名。

    要求：
    - 中文，4~10 个字，像一个栏目标题，不是句子
    - 不要包含游戏名、主播名（那是文件名里另外的部分）
    - 不要带「上篇」「下篇」「合集」这类字眼
    - 只输出篇名本身，不要解释、不要引号、不要标点

  # 片单的「内容介绍 / 关键字」：必须是 JSON，字段名固定
  ledger_copy: |
    你是游戏实况视频的运营编辑，正在填写交付给甲方的片单表格。
    会给你一个合集的每集标题，请为这个合集写两句交付用文案。

    只输出一个 JSON 对象，不要解释、不要代码块：
    {"intro": "...", "keywords": "..."}

    要求：
    - intro：20~40 个汉字，概括这一合集的内容走向。用中文标点，以句号结尾
    - keywords：4~6 个关键词，用顿号「、」分隔，不加书名号、不加空格
