# ══════════════════════════════════════════════════════════════════
# agent.yaml —— 字幕 agent 的模型与密钥
#
# 【怎么用】
#   复制 `agent.example.yaml` 为 `agent.yaml`，把值改成你自己的。
#
# 【为什么不放在 本机.yaml】
#   本机.yaml 放的是"这台机器有什么"（路径、ffmpeg 在哪）。
#   这里放的是"用哪个账号、哪个模型"—— 会随厂商更新而变，
#   而且换账号时只改这一处。分开就不用每次动路径配置。
#
# 【不进 git】
#   本文件含明文 key，已在 .gitignore 里。`agent.example.yaml` 入库做模板。
#
# 【为什么模型名不写死在代码里】
#   模型名会变（deepseek-chat → deepseek-v4-pro → deepseek-flash → …）。
#   写死在代码里意味着每次厂商改名都要改代码、提交、重新拉仓库。
#   放这里改一行就行，代码不用动。
# ══════════════════════════════════════════════════════════════════

deepseek:
  # API key。
  # 优先级：环境变量 deepseek_env_key / DEEPSEEK_API_KEY / DEEPSEEK_KEY
  #         > 这里的值
  # 所以 CI 之类不方便写文件的场景，仍然可以用环境变量覆盖。
  api_key: ""

  # 三个用途共用这一个模型：
  #   构建知识库 / 字幕纠错 / 标题生成
  #
  # ⚠ 纠错这一环**不要换成推理模型**。实测推理模型会把 token 全烧在推理里、
  #   正文一个字都不吐（finish_reason=length、content 为空），
  #   结果就是"跑完了但什么都没改"。
  model: "deepseek-flash"

  # 单次回复的 token 上限。
  #
  # **这是上限，不是预留** —— 模型说完就停，按实际用量计费，给大不浪费钱。
  # 它必须给推理留够额度：模型先输出 reasoning_content（内部推理），再输出
  # content（正文）。推理把额度吃光时 content 为空、finish_reason=length，
  # 表现是"跑了几分钟，字幕一处没改"。
  #
  # 实测（deepseek-flash，8.7 KB / 329 行字幕）：
  #     prompt 5,378 + completion 12,381 = 17,759 token
  #     max_tokens=8192  → 必死：推理吃光，正文 0 字，55 秒白跑
  #     max_tokens=32768 → 够用：106 秒，改 18 处
  #
  # 2 小时素材约 50 KB。按最坏的线性外推：
  #     prompt 5,378 × (50/8.7) ≈ 30,900
  #     completion ≈ 30,900 × 2.3 ≈ 71,000
  # 取 1.4 倍余量 → 98304。（按幂律拟合只需 ~39,000，这里宁大勿小。）
  #
  # 如果还是被截断，报错里会给出实际 completion_tokens，照着调大即可。
  max_tokens: 98304
