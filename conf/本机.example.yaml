# ══════════════════════════════════════════════════════════════════
# 本机环境 · 示例文件
#
# 【怎么用】
#   复制这个文件为 `本机.yaml`，把下面的值改成你自己的。
#   AI 助手（DSH）首次引导时也会帮你自动填好。
#
# 【为什么分成两个文件】
#   `本机.yaml`      人写：路径、外部工具。程序只读，永不重写。
#   `本机能力.yaml`  程序写：实测出来的编码器、速度、超时。别手改。
#   分开的原因：程序重写 YAML 会抹掉注释。你手写的注释必须保住。
#
# 【不进 git】
#   本文件（example）入库；`本机.yaml` 在 .gitignore 里。
#   换电脑就重走一遍 AGENTS.md §1。
# ══════════════════════════════════════════════════════════════════


# ── 视频工作区根目录 ──
# 所有批次（{游戏}-{批次}）都建在这个目录下。
# 建议放在空间充足的盘。
#   C 盘只剩几十 G 的话不要放这里 —— 一个 2.5 小时合集光导出就 11 GB。
workspace:
  root: "D:/VedioRecords/工作区"


# ── 外部工具 ──
# 可写绝对路径，也可只写命令名（表示已加入系统 PATH）。
# 推荐后者：装了 ffmpeg 并配好环境变量后，保持默认即可。
tool:
  ffmpeg: "ffmpeg"
  ffprobe: "ffprobe"


# ── 剪映 ──
# draft_dir：**留空就行，程序会自己查。**
#   自动发现读的是剪映自己维护的明文索引：
#     %LOCALAPPDATA%\JianyingPro\User Data\Projects\*\root_meta_info.json
#   里面直接有 草稿显示名 / 实际文件夹 / 时长，比全盘搜 draft_content.json 可靠。
#   ⚠ 草稿的「文件夹名」不一定等于界面上的「显示名」
#     （实测文件夹叫 `11月7日`，界面上显示的是 `MC-合集一`），所以别靠目录名猜。
#
#   只有自动发现不准时才手填，例如：
#     draft_dir: "D:/VedioRecords/剪辑草稿/剪映草稿/JianyingPro Drafts"
#
# window_title：剪映主窗口标题，用于 GUI 自动化定位。
jianying:
  draft_dir: ""
  window_title: "剪映专业版"


# ── DeepSeek API ──
# 不在这里。key 和模型名在 conf/agent.yaml（模板：agent.example.yaml）。
# 分开的原因：本文件放"这台机器有什么"（路径、工具），
# agent.yaml 放"用哪个账号、哪个模型"—— 后者会随厂商更新而变。

